name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Manifest valid
        run: node -e "const m=require('./extension/manifest.json'); if(m.manifest_version!==3) process.exit(1); console.log('manifest v'+m.version)"
      - name: JS syntax
        run: for f in extension/*.js; do node --check "$f"; done

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t phishing-guard-backend ./backend
      - name: Smoke test
        run: |
          docker run -d --rm -p 8000:8000 --name pg phishing-guard-backend
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          curl -sf -X POST http://127.0.0.1:8000/analyze/url -H 'content-type: application/json' \
            -d '{"url":"http://paypa1-login.com/verify"}' | grep -q dangerous
          docker stop pg
